[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fignimble"
version = "0.4.0"
description = "Multi-panel figures for publication, assembled from Python"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.7", "pymupdf>=1.24", "pillow>=10", "numpy>=1.24"]
license = { text = "BSD-2-Clause" }

[project.optional-dependencies]
# the editor for Windows and Linux (apps/desktop); macOS has its own app (apps/macos)
desktop = ["PySide6-Essentials>=6.5"]

[project.scripts]
fignimble = "fignimble.cli:main"

[project.gui-scripts]
fignimble-app = "fignimble_app.__main__:main"

[tool.setuptools.packages.find]
where = ["engine", "apps/desktop"]

[tool.setuptools.package-data]
fignimble_app = ["assets/*"]
